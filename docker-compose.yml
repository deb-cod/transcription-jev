services:
  classifier-api:
    build: .
    environment:
      OPENJEV_URL: http://host.docker.internal:8090
      OLLAMA_URL: http://host.docker.internal:11434
      ENABLE_CONFIG_RELOAD: "false"
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
